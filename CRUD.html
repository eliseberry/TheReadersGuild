<!DOCTYPE html>
<html lang="en" ng-app="bookapp">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>CRUD function</title>
   <link rel="stylesheet" href="../TheReadersGuild/css/CRUDStyle.css">
   <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
</head>
<body ng-controller="CRUDcontroller">
   <div class="container">
      <h2>Books</h2>
      <table id="booksTable" class="table">
         <thead>
            <tr>
               <th>Id</td>
               <th>Title</th>
               <th>Author</th>
               <th>Release Year</th>
               <th>Genre</th>
               <th>Edit</th>
               <th>Delete</th>
            </tr>
         </thead>
            <tr ng-repeat="book in books">
               <td>{{book.Id}}</td>
               <td>{{book.Title}}</td>
               <td>{{book.Author}}</td>
               <td>{{book.releaseYear}}</td>
               <td>{{book.Genre}}</td>
            </tr>
         </tbody>
      </table>
   

   <h1>Add Book</h1>
   <form id="addBookForm" onsubmit="addBook(event)">
      <label for="title">Title:</label>
      <input type="text" id="title" name="title" placeholder="Enter title" required>

      <label for="author">Author:</label>
      <input type="text" id="author" name="author" placeholder="Enter author name" required>

      <label for="releaseYear">Release Year:</label>
      <input type="text" id="releaseYear" name="releaseYear" placeholder="Enter release year" required>

      <label for="genre">Genre:</label>
      <input type="text" id="genre" name="genre" placeholder="Enter genre" required>

      <button type="submit">Add Book</button>
   </form>
   </div>

   <script src="../TheReadersGuild/js/CRUDcontroller.js"></script>
</body>
</html>
